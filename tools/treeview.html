<!doctype html>
<html>
<head><meta charset="utf-8" /><base href="/" /><title>tree view</title><style>body{margin:0}</style></head>
<body>
<script type="module">
import * as THREE from 'three';
import { speciesTree } from '/src/game/trees.js';
import { THEMES } from '/src/game/themes.js';

// renders each generated species tree with its venue tints for QA
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(480, 560);
document.body.appendChild(renderer.domElement);
const shots = {};
for (const [key, theme] of Object.entries(THEMES)) {
  const sp = speciesTree(theme);
  if (!sp) continue;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8798ab);
  scene.add(new THREE.HemisphereLight(0xdcecff, 0x9aa89b, 0.95));
  const sun = new THREE.DirectionalLight(0xfff0c8, 1.7);
  sun.position.set(6, 11, 8);
  scene.add(sun);
  scene.add(new THREE.Mesh(sp.trunk, new THREE.MeshLambertMaterial({ color: theme.trunk })));
  scene.add(new THREE.Mesh(sp.foliage, new THREE.MeshLambertMaterial({ color: theme.foliage })));
  scene.add(new THREE.Mesh(sp.snow, new THREE.MeshLambertMaterial({ color: 0xf4f8fd })));
  const H = theme.treeH ?? 7.5;
  const cam = new THREE.PerspectiveCamera(40, 480 / 560, 0.1, 200);
  cam.position.set(H * 1.0, H * 0.62, H * 1.45);
  cam.lookAt(0, H * 0.46, 0);
  renderer.render(scene, cam);
  shots[key] = renderer.domElement.toDataURL('image/png').split(',')[1];
}
window.__result = JSON.stringify(shots);
</script>
</body>
</html>
