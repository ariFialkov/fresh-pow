<!doctype html>
<html>
<head><meta charset="utf-8" /><title>cluster roles</title><style>body{margin:0}</style></head>
<body>
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

// canonical cluster centers (from convert run) — false-color each cluster
const CENTERS = {
  boarder: ['#121214', '#403f2f', '#6e5036', '#2f2a29', '#593e26', '#8d684e', '#d49274', '#421c95', '#dacfc5', '#2a66db'],
  skier: ['#1b191b', '#222023', '#b42f2b', '#151214', '#8b211f', '#342e2f', '#391b1c', '#602423', '#85685c', '#c6a495'],
  tuber: ['#1f2736', '#1a1a1f', '#131317', '#232125', '#29303e', '#ed6025', '#efae94', '#983a11', '#583b31', '#a0786a'],
};
const RAINBOW = ['#ff0000', '#ff9900', '#ffee00', '#33cc33', '#00ffcc', '#0066ff', '#9933ff', '#ff33cc', '#ffffff', '#663300'];

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(1200, 700);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x333844);
scene.add(new THREE.AmbientLight(0xffffff, 1.0));
const camera = new THREE.PerspectiveCamera(35, 1200 / 700, 0.01, 100);

const loader = new FBXLoader();
const hex2rgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];

async function waitImage(tex, ms = 20000) {
  const t0 = performance.now();
  while (!(tex?.image && tex.image.width > 0)) {
    if (performance.now() - t0 > ms) return false;
    await new Promise((r) => setTimeout(r, 100));
  }
  return true;
}

window.__base = {};
for (const [i, id] of ['boarder', 'skier', 'tuber'].entries()) {
  const obj = await loader.loadAsync(`/models/${id}.fbx`);
  let mesh;
  obj.traverse((o) => { if (o.isSkinnedMesh) mesh = o; });
  const mat = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
  await waitImage(mat.map);

  // save 1024 base jpeg for runtime recoloring
  const bc = document.createElement('canvas');
  bc.width = bc.height = 1024;
  bc.getContext('2d').drawImage(mat.map.image, 0, 0, 1024, 1024);
  window.__base[id] = bc.toDataURL('image/jpeg', 0.82).split(',')[1];

  // false-color by nearest cluster
  const cvs = document.createElement('canvas');
  cvs.width = cvs.height = 1024;
  const ctx = cvs.getContext('2d');
  ctx.drawImage(mat.map.image, 0, 0, 1024, 1024);
  const im = ctx.getImageData(0, 0, 1024, 1024);
  const px = im.data;
  const centers = CENTERS[id].map(hex2rgb);
  const rain = RAINBOW.map(hex2rgb);
  for (let p = 0; p < px.length; p += 4) {
    let bi = 0, bd = 1e9;
    for (let ci = 0; ci < centers.length; ci++) {
      const c = centers[ci];
      const d = (px[p] - c[0]) ** 2 + (px[p + 1] - c[1]) ** 2 + (px[p + 2] - c[2]) ** 2;
      if (d < bd) { bd = d; bi = ci; }
    }
    px[p] = rain[bi][0]; px[p + 1] = rain[bi][1]; px[p + 2] = rain[bi][2];
  }
  ctx.putImageData(im, 0, 0);
  const tex = new THREE.CanvasTexture(cvs);
  tex.flipY = mat.map.flipY;
  tex.colorSpace = THREE.SRGBColorSpace;
  mesh.material = new THREE.MeshBasicMaterial({ map: tex });

  obj.scale.setScalar(0.0105);
  obj.position.set((i - 1) * 1.5, 0, 0);
  scene.add(obj);
}

camera.position.set(0, 1.1, 4.4);
camera.lookAt(0, 0.85, 0);
renderer.render(scene, camera);
window.__front = renderer.domElement.toDataURL('image/png');
camera.position.set(0, 1.4, -4.4);
camera.lookAt(0, 0.85, 0);
renderer.render(scene, camera);
window.__rear = renderer.domElement.toDataURL('image/png');
window.__done = true;
</script>
</body>
</html>
