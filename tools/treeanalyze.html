<!doctype html>
<html>
<head><meta charset="utf-8" /><base href="/" /><title>tree analyze</title></head>
<body>
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

// Measures each original tree sculpt's silhouette: per height band the 80th
// percentile radius and mean lateral offset (asymmetry), plus where the
// crown begins. These numbers parameterize the procedural species builders.
const VENUES = ['vermont', 'quebec', 'colorado', 'utah', 'bc', 'chile', 'nz', 'swiss', 'japan'];
const BANDS = 12;

const manager = new THREE.LoadingManager();
manager.setURLModifier((url) => (/\.(png|jpg|jpeg|tga)$/i.test(url) ? 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==' : url));
const loader = new FBXLoader(manager);
const out = {};

for (const venue of VENUES) {
  const obj = await loader.loadAsync(`/assets-src/trees/${venue}.fbx`);
  obj.updateMatrixWorld(true);
  const pts = [];
  obj.traverse((o) => {
    if (!o.isMesh) return;
    const g = o.geometry;
    const p = g.attributes.position;
    const v = new THREE.Vector3();
    const step = Math.max(1, Math.floor(p.count / 60000));
    for (let i = 0; i < p.count; i += step) {
      v.fromBufferAttribute(p, i).applyMatrix4(o.matrixWorld);
      pts.push([v.x, v.y, v.z]);
    }
  });
  let minY = 1e9, maxY = -1e9, sx = 0, sz = 0;
  for (const [x, y, z] of pts) { if (y < minY) minY = y; if (y > maxY) maxY = y; }
  const H = maxY - minY;
  // center on the trunk base: mean xz of the bottom 8%
  let bn = 0;
  for (const [x, y, z] of pts) if (y < minY + H * 0.08) { sx += x; sz += z; bn++; }
  const cx = sx / bn, cz = sz / bn;

  const bands = [];
  for (let b = 0; b < BANDS; b++) {
    const y0 = minY + (H * b) / BANDS, y1 = minY + (H * (b + 1)) / BANDS;
    const rs = [];
    let ox = 0, oz = 0, n = 0;
    for (const [x, y, z] of pts) {
      if (y < y0 || y >= y1) continue;
      rs.push(Math.hypot(x - cx, z - cz));
      ox += x - cx; oz += z - cz; n++;
    }
    rs.sort((a, b2) => a - b2);
    const r80 = rs.length ? rs[Math.floor(rs.length * 0.8)] : 0;
    const r30 = rs.length ? rs[Math.floor(rs.length * 0.3)] : 0;
    bands.push({
      r80: +(r80 / H * 100).toFixed(1),
      r30: +(r30 / H * 100).toFixed(1),
      off: n ? [+((ox / n) / H * 100).toFixed(1), +((oz / n) / H * 100).toFixed(1)] : [0, 0],
      n,
    });
  }
  out[venue] = { bands };
}
window.__result = JSON.stringify(out);
document.title = 'done';
</script>
</body>
</html>
