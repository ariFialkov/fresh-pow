<!doctype html>
<html>
<head><meta charset="utf-8" /><title>fbx inspect</title></head>
<body>
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

const out = {};
const loader = new FBXLoader();

function describe(root) {
  const bones = [];
  const meshes = [];
  const others = [];
  root.traverse((o) => {
    if (o.isBone) {
      bones.push({
        name: o.name,
        parent: o.parent?.name,
        pos: o.position.toArray().map((v) => +v.toFixed(3)),
        rot: o.rotation.toArray().slice(0, 3).map((v) => +(v * 57.29578).toFixed(1)),
      });
    } else if (o.isMesh || o.isSkinnedMesh) {
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      meshes.push({
        name: o.name,
        skinned: !!o.isSkinnedMesh,
        verts: o.geometry.attributes.position.count,
        groups: o.geometry.groups?.length ?? 0,
        materials: mats.map((m) => ({
          name: m.name,
          color: m.color ? '#' + m.color.getHexString() : null,
          map: m.map ? (m.map.name || 'tex') : null,
        })),
      });
    } else if (!o.isBone) {
      others.push({ name: o.name, type: o.type, children: o.children.length });
    }
  });
  const box = new THREE.Box3().setFromObject(root);
  const size = new THREE.Vector3();
  box.getSize(size);
  return {
    bbox: size.toArray().map((v) => +v.toFixed(2)),
    min: box.min.toArray().map((v) => +v.toFixed(2)),
    animations: root.animations?.map((a) => ({ name: a.name, dur: +a.duration.toFixed(2), tracks: a.tracks.length })),
    scale: root.scale.toArray(),
    bones,
    meshes,
    others: others.slice(0, 30),
  };
}

for (const id of ['boarder', 'skier', 'tuber']) {
  try {
    const obj = await loader.loadAsync(`/models/${id}.fbx`);
    out[id] = describe(obj);
  } catch (e) {
    out[id] = { error: String(e) };
  }
}
window.__result = JSON.stringify(out);
document.body.textContent = 'done';
</script>
</body>
</html>
