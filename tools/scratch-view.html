<!doctype html>
<html>
<head><meta charset="utf-8" /><base href="/" /><title>scratch view</title><style>body{margin:0}</style></head>
<body>
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

// Inspect start_gate + pavilion: same component split as propconvert, with
// wandlike comps painted red and per-component boxes reported, so we can
// find the turnstile arms, lane centers and the pavilion's front dividers.
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(900, 620);
document.body.appendChild(renderer.domElement);
const loader = new FBXLoader();
const shots = {};
const info = {};

for (const id of ['start_gate', 'pavilion']) {
  const obj = await loader.loadAsync(`/models/prop_${id}.fbx`);
  obj.updateMatrixWorld(true);
  let src = null;
  obj.traverse((o) => { if (o.isMesh) src = o; });
  let geo = src.geometry.clone().applyMatrix4(src.matrixWorld);
  if (geo.index) geo = geo.toNonIndexed();
  const pos = geo.attributes.position;
  const triCount = pos.count / 3;

  const parent = new Int32Array(triCount);
  for (let i = 0; i < triCount; i++) parent[i] = i;
  const find = (a) => { while (parent[a] !== a) { parent[a] = parent[parent[a]]; a = parent[a]; } return a; };
  const union = (a, b) => { const ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; };
  const vertMap = new Map();
  for (let t = 0; t < triCount; t++) {
    for (let k = 0; k < 3; k++) {
      const i = t * 3 + k;
      const key = `${Math.round(pos.getX(i) * 500)},${Math.round(pos.getY(i) * 500)},${Math.round(pos.getZ(i) * 500)}`;
      const prev = vertMap.get(key);
      if (prev === undefined) vertMap.set(key, t);
      else union(prev, t);
    }
  }
  const comps = new Map();
  for (let t = 0; t < triCount; t++) {
    const root = find(t);
    let c = comps.get(root);
    if (!c) { c = { tris: [], box: new THREE.Box3() }; comps.set(root, c); }
    c.tris.push(t);
    for (let k = 0; k < 3; k++) {
      const i = t * 3 + k;
      c.box.expandByPoint(new THREE.Vector3(pos.getX(i), pos.getY(i), pos.getZ(i)));
    }
  }
  const mBox = new THREE.Box3().setFromBufferAttribute(pos);
  const mDiag = mBox.getSize(new THREE.Vector3()).length();

  // color wandlike comps red, everything else grey; collect wand boxes
  const colAttr = new Float32Array(pos.count * 3);
  const wands = [];
  for (const c of comps.values()) {
    const size = c.box.getSize(new THREE.Vector3());
    const dims = [size.x, size.y, size.z].sort((a, b) => a - b);
    const wandlike = dims[1] < 0.03 * mDiag && dims[2] > 0.15 * mDiag;
    const col = wandlike ? [1, 0.1, 0.1] : [0.72, 0.77, 0.82];
    if (wandlike) {
      wands.push({
        min: c.box.min.toArray().map((v) => +v.toFixed(1)),
        max: c.box.max.toArray().map((v) => +v.toFixed(1)),
        tris: c.tris.length,
      });
    }
    for (const t of c.tris) {
      for (let k = 0; k < 3; k++) {
        const i = t * 3 + k;
        colAttr[i * 3] = col[0]; colAttr[i * 3 + 1] = col[1]; colAttr[i * 3 + 2] = col[2];
      }
    }
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colAttr, 3));
  // components that intersect the bar-height slab across the center lane
  const slab = new THREE.Box3(new THREE.Vector3(-23, 4.5, 0), new THREE.Vector3(17, 10.5, 7));
  const slabComps = [];
  const allComps = [];
  for (const c of comps.values()) {
    allComps.push({
      min: c.box.min.toArray().map((v) => +v.toFixed(1)),
      max: c.box.max.toArray().map((v) => +v.toFixed(1)),
      tris: c.tris.length,
    });
    if (id === 'start_gate' && c.box.intersectsBox(slab)) {
      slabComps.push(allComps[allComps.length - 1]);
    }
  }
  // mean normals of the wide front panels (screen shells)
  const shellNormals = [];
  const srcN2 = geo.attributes.normal;
  for (const c of comps.values()) {
    const size = c.box.getSize(new THREE.Vector3());
    if (size.x < 25 || c.box.max.z < 14) continue;
    if (size.y < 5 || size.y > 16) continue;
    const n = new THREE.Vector3();
    for (const t of c.tris) {
      for (let k = 0; k < 3; k++) n.add(new THREE.Vector3().fromBufferAttribute(srcN2, t * 3 + k));
    }
    n.normalize();
    shellNormals.push({
      min: c.box.min.toArray().map((v) => +v.toFixed(1)),
      max: c.box.max.toArray().map((v) => +v.toFixed(1)),
      n: n.toArray().map((v) => +v.toFixed(2)),
    });
  }
  info[id] = {
    box: { min: mBox.min.toArray().map((v) => +v.toFixed(1)), max: mBox.max.toArray().map((v) => +v.toFixed(1)) },
    comps: comps.size,
    wands,
    slabComps,
    shellNormals,
  };

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8798ab);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x556677, 1.1));
  const sun = new THREE.DirectionalLight(0xfff2dd, 1.6);
  sun.position.set(3, 5, 4);
  scene.add(sun);
  const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true }));
  const c = mBox.getCenter(new THREE.Vector3());
  mesh.position.sub(c);
  scene.add(mesh);
  const bs = mBox.getSize(new THREE.Vector3());
  const d = bs.length();

  const persp = new THREE.PerspectiveCamera(45, 900 / 620, 0.1, 5000);
  persp.position.set(d * 0.45, d * 0.4, d * 0.6);
  persp.lookAt(0, 0, 0);
  renderer.render(scene, persp);
  shots[id + '_persp'] = renderer.domElement.toDataURL('image/png').split(',')[1];

  // front elevation (looking along -z)
  const of = new THREE.OrthographicCamera(-bs.x * 0.55, bs.x * 0.55, bs.y * 0.62, -bs.y * 0.62, 0.1, 5000);
  of.position.set(0, 0, bs.z + 60);
  of.lookAt(0, 0, 0);
  renderer.render(scene, of);
  shots[id + '_front'] = renderer.domElement.toDataURL('image/png').split(',')[1];

  // back elevation (looking along +z)
  const ob = of.clone();
  ob.position.set(0, 0, -(bs.z + 60));
  ob.lookAt(0, 0, 0);
  renderer.render(scene, ob);
  shots[id + '_back'] = renderer.domElement.toDataURL('image/png').split(',')[1];

  // top plan (looking down)
  const ot = new THREE.OrthographicCamera(-bs.x * 0.55, bs.x * 0.55, bs.z * 0.62, -bs.z * 0.62, 0.1, 5000);
  ot.position.set(0, bs.y + 60, 0);
  ot.lookAt(0, 0, 0);
  renderer.render(scene, ot);
  shots[id + '_top'] = renderer.domElement.toDataURL('image/png').split(',')[1];
}

window.__result = JSON.stringify({ shots, info });
document.title = 'done';
</script>
</body>
</html>
