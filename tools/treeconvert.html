<!doctype html>
<html>
<head><meta charset="utf-8" /><base href="/" /><title>tree convert</title></head>
<body>
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// Venue tree prefabs: high-poly untextured sculpts. Bake + merge, normalize
// to height 100 with the base on y=0, and bucket every triangle into three
// named materials the runtime tints per theme:
//   trunk   — near the vertical axis (bark)
//   foliage — everything else (needles/branches)
//   snow    — upward-facing foliage above the skirt (settled snow)
// The heavy decimation happens afterwards in scripts/optimize-trees.mjs.
const VENUES = ['bc', 'chile', 'colorado', 'japan', 'nz', 'quebec', 'utah', 'vermont', 'swiss'];

const b64 = (buf) => {
  const bytes = new Uint8Array(buf);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
};

const manager = new THREE.LoadingManager();
manager.setURLModifier((url) => (/\.(png|jpg|jpeg|tga)$/i.test(url) ? 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==' : url));
const loader = new FBXLoader(manager);

const outScene = new THREE.Scene();
const report = {};

for (const venue of VENUES) {
  const obj = await loader.loadAsync(`/assets-src/trees/${venue}.fbx`);
  obj.updateMatrixWorld(true);
  const geos = [];
  obj.traverse((o) => {
    if (!o.isMesh) return;
    let g = o.geometry.clone().applyMatrix4(o.matrixWorld);
    if (g.index) g = g.toNonIndexed();
    for (const name of Object.keys(g.attributes)) {
      if (!['position', 'normal'].includes(name)) g.deleteAttribute(name);
    }
    geos.push(g);
  });
  const geo = geos.length > 1 ? mergeGeometries(geos, false) : geos[0];

  // normalize: base y0, centered, height 100
  geo.computeBoundingBox();
  const bb = geo.boundingBox;
  const size = bb.getSize(new THREE.Vector3());
  geo.translate(-(bb.min.x + bb.max.x) / 2, -bb.min.y, -(bb.min.z + bb.max.z) / 2);
  const k = 100 / size.y;
  geo.scale(k, k, k);

  // ---- decimate by vertex clustering. These AI sculpts are thousands of
  // tiny disconnected shells, which border-respecting simplifiers refuse
  // to collapse — snapping vertices to a grid and dropping the degenerate
  // and duplicate triangles flattens them into one chunky low-poly tree
  // that suits the game's look. Shrink the grid until the budget fits. ----
  const srcPos = geo.attributes.position;
  const srcTris = srcPos.count / 3;
  let simped = null;
  for (let G = 46; G >= 14; G -= 4) {
    const cell = new Map(); // cell key -> {sx, sy, sz, n, idx}
    const cellOf = (x, y, z) => {
      const s = 100 / G;
      const key = `${Math.round(x / s)},${Math.round(y / s)},${Math.round(z / s)}`;
      let c = cell.get(key);
      if (!c) {
        c = { sx: 0, sy: 0, sz: 0, n: 0, idx: cell.size };
        cell.set(key, c);
      }
      c.sx += x; c.sy += y; c.sz += z; c.n++;
      return c.idx;
    };
    const triSet = new Set();
    const triCells = [];
    for (let t = 0; t < srcTris; t++) {
      const a = cellOf(srcPos.getX(t * 3), srcPos.getY(t * 3), srcPos.getZ(t * 3));
      const b = cellOf(srcPos.getX(t * 3 + 1), srcPos.getY(t * 3 + 1), srcPos.getZ(t * 3 + 1));
      const c = cellOf(srcPos.getX(t * 3 + 2), srcPos.getY(t * 3 + 2), srcPos.getZ(t * 3 + 2));
      if (a === b || b === c || a === c) continue; // collapsed
      const key = [a, b, c].sort((p, q) => p - q).join(',');
      if (triSet.has(key)) continue; // overlapping shell duplicate
      triSet.add(key);
      triCells.push(a, b, c);
    }
    if (triCells.length / 3 > 1200 && G > 14) continue;
    // cluster representative = mean of member vertices
    const reps = new Float32Array(cell.size * 3);
    for (const c of cell.values()) {
      reps[c.idx * 3] = c.sx / c.n;
      reps[c.idx * 3 + 1] = c.sy / c.n;
      reps[c.idx * 3 + 2] = c.sz / c.n;
    }
    const flat = new Float32Array(triCells.length * 3);
    for (let i = 0; i < triCells.length; i++) {
      flat[i * 3] = reps[triCells[i] * 3];
      flat[i * 3 + 1] = reps[triCells[i] * 3 + 1];
      flat[i * 3 + 2] = reps[triCells[i] * 3 + 2];
    }
    // consistent winding: flip faces whose normal points into the trunk
    // axis so lighting reads outward everywhere
    const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3();
    const ab = new THREE.Vector3(), ac = new THREE.Vector3(), fn = new THREE.Vector3();
    for (let t = 0; t < flat.length / 9; t++) {
      A.fromArray(flat, t * 9);
      B.fromArray(flat, t * 9 + 3);
      C.fromArray(flat, t * 9 + 6);
      fn.crossVectors(ab.subVectors(B, A), ac.subVectors(C, A));
      const cx = (A.x + B.x + C.x) / 3, cy = (A.y + B.y + C.y) / 3, cz = (A.z + B.z + C.z) / 3;
      const out = new THREE.Vector3(cx, Math.hypot(cx, cz) < 5 ? 8 : 2, cz);
      if (fn.dot(out) < 0) {
        // swap B and C
        for (let i = 0; i < 3; i++) {
          const tmp = flat[t * 9 + 3 + i];
          flat[t * 9 + 3 + i] = flat[t * 9 + 6 + i];
          flat[t * 9 + 6 + i] = tmp;
        }
      }
    }
    simped = new THREE.BufferGeometry();
    simped.setAttribute('position', new THREE.BufferAttribute(flat, 3));
    simped.computeVertexNormals();
    simped.userData.grid = G;
    break;
  }

  // bucket triangles
  const pos = simped.attributes.position;
  const nrm = simped.attributes.normal;
  const triCount = pos.count / 3;
  const bucket = new Uint8Array(triCount); // 0 trunk, 1 foliage, 2 snow
  const stats = [0, 0, 0];
  for (let t = 0; t < triCount; t++) {
    let cx = 0, cy = 0, cz = 0, ny = 0;
    for (let i = 0; i < 3; i++) {
      cx += pos.getX(t * 3 + i);
      cy += pos.getY(t * 3 + i);
      cz += pos.getZ(t * 3 + i);
      ny += nrm.getY(t * 3 + i);
    }
    cx /= 3; cy /= 3; cz /= 3; ny /= 3;
    const rad = Math.hypot(cx, cz);
    let b;
    // bark: the exposed lower bole, plus only a very thin core higher up —
    // narrow crowns (black spruce) must not read as bare trunk
    if ((rad < 7 && cy < 30) || (rad < 3.2 && cy < 70)) b = 0;
    else if (ny > 0.6 && cy > 30) b = 2;
    else b = 1;
    bucket[t] = b;
    stats[b]++;
  }

  // rebuild ordered by bucket with groups + named materials
  const order = [];
  for (let b = 0; b < 3; b++) for (let t = 0; t < triCount; t++) if (bucket[t] === b) order.push(t);
  const nPos = new Float32Array(order.length * 9);
  const nNorm = new Float32Array(order.length * 9);
  let w = 0;
  for (const t of order) {
    for (let i = 0; i < 3; i++) {
      const v = t * 3 + i;
      nPos[w] = pos.getX(v); nNorm[w++] = nrm.getX(v);
      nPos[w] = pos.getY(v); nNorm[w++] = nrm.getY(v);
      nPos[w] = pos.getZ(v); nNorm[w++] = nrm.getZ(v);
    }
  }
  const ng = new THREE.BufferGeometry();
  ng.setAttribute('position', new THREE.BufferAttribute(nPos, 3));
  ng.setAttribute('normal', new THREE.BufferAttribute(nNorm, 3));
  const names = ['trunk', 'foliage', 'snow'];
  const mats = [];
  let start = 0;
  for (let b = 0; b < 3; b++) {
    if (stats[b] === 0) continue;
    ng.addGroup(start, stats[b] * 3, mats.length);
    const m = new THREE.MeshStandardMaterial({ color: 0x888888 });
    m.name = names[b];
    mats.push(m);
    start += stats[b] * 3;
  }
  const mesh = new THREE.Mesh(ng, mats);
  mesh.name = `tree_${venue}`;
  outScene.add(mesh);
  report[venue] = {
    srcTris,
    tris: triCount,
    grid: simped.userData.grid,
    trunk: stats[0],
    foliage: stats[1],
    snow: stats[2],
  };
}

const exporter = new GLTFExporter();
const glb = await exporter.parseAsync(outScene, { binary: true });
window.__result = JSON.stringify({ report, glb: b64(glb) });
document.title = 'done';
</script>
</body>
</html>
